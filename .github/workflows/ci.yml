name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: arc-runner-set-base84

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Install race detector prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libc6-dev

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Build
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || printf devel)"
          go build -ldflags "-s -w -X main.version=${VERSION}" -o base84 ./cmd/base84
